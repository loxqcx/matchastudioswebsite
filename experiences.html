<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Our Games — Matcha Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" type="image/png" href="images/logo.png" />
</head>
<body>

<div id="page-loader" class="page-loader">
  <img src="images/logo.png" class="page-loader__logo" alt="Matcha Studio">
  <div class="page-loader__spinner"></div>
</div>

<nav class="navbar">
  <div class="container">
    <a href="/" class="brand">
      <img src="images/logo.png" class="brand__mark" alt="Matcha Studio logo">
      Matcha Studio
    </a>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/experiences">Our Games</a></li>
      <li><a href="/#about">About</a></li>
      <li><a href="/#careers">Careers</a></li>
      <li><a href="https://discord.gg/TQrd3wcyf7" target="_blank" rel="noopener">Discord</a></li>
      <li><a href="/#contact" class="btn btn--primary">Get in touch</a></li>
    </ul>
    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
  </div>
</nav>

<header class="hero page-hero">
  <div class="container">
    <span class="eyebrow"><span class="pulse-dot"></span> Portfolio</span>
    <h1>Our <span>games.</span></h1>
    <p class="lead">Every experience we operate, ordered by players online.</p>
  </div>
</header>

<section>
  <div class="container">
    <!-- No number on data-games-grid = show every game in games-config.js -->
    <div class="games-grid" data-games-grid=""></div>
  </div>
</section>

<footer>
  <div class="container">
    <a href="/" class="brand">
      <img src="images/logo.png" class="brand__mark" alt="Matcha Studio logo">
      Matcha Studio
    </a>
    <ul class="footer-links">
      <li><a href="/experiences">Our Games</a></li>
      <li><a href="/#about">About</a></li>
      <li><a href="/#careers">Careers</a></li>
      <li><a href="/#contact">Contact</a></li>
    </ul>
    <p class="footer-note">© 2026 Matcha Studio. All rights reserved.</p>
  </div>
</footer>

<script src="js/games-config.js"></script>
<script src="js/main.js"></script>
</body>
</html>
